{% extends 'books/base.html' %}
{% block title %}Set New Password{% endblock %}

{% block content %}
<div class="container auth-container">
    <div class="auth-card">
        <h2>New Password</h2>
        <form method="post">
            {% csrf_token %}
            <div class="form-group password-group">
                <label>New Password</label>
                <input type="password" name="password" id="new-password" required class="form-control">
                <i class="fas fa-eye toggle-password" data-target="new-password"></i>
                <div class="strength-meter">
                    <div class="strength-bar" id="strength-bar"></div>
                </div>
                <small id="strength-text">Weak</small>
            </div>
            <div class="form-group password-group">
                <label>Confirm Password</label>
                <input type="password" name="confirm_password" id="confirm-password" required class="form-control">
                <i class="fas fa-eye toggle-password" data-target="confirm-password"></i>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Reset Password</button>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'books/js/auth.js' %}"></script>
{% endblock %}
