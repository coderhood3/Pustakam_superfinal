{% extends 'books/base.html' %}
{% load static %}
{% block title %}Edit Profile{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'books/css/edit_profile.css' %}">
{% endblock %}

{% block content %}
<div class="container auth-container">
    <div class="auth-card">
        <h2>Edit Profile</h2>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="form-row">
                <div class="form-group col">
                    <label>First Name</label>
                    <input type="text" name="first_name" value="{{ user.first_name }}" class="form-control"
                        placeholder="John">
                </div>
                <div class="form-group col">
                    <label>Last Name</label>
                    <input type="text" name="last_name" value="{{ user.last_name }}" class="form-control"
                        placeholder="Doe">
                </div>
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" name="phone_number" value="{{ profile.phone_number }}" class="form-control"
                    placeholder="+91 98765 43210">
            </div>

            <div class="form-group">
                <label>Address</label>
                <textarea name="address" class="form-control" rows="3"
                    placeholder="Enter your full shipping address">{{ profile.address }}</textarea>
            </div>

            <label>Profile Picture</label>
            <div class="avatar-upload-container">
                <img src="{% if profile.avatar %}{{ profile.avatar.url }}{% else %}{% static 'books/images/default_avatar.png' %}{% endif %}"
                    alt="Preview" class="avatar-preview" id="avatarPreview"
                    onerror="this.src='https://ui-avatars.com/api/?name={{ user.first_name }}+{{ user.last_name }}&background=random'">

                <div class="file-input-wrapper">
                    <input type="file" name="avatar" class="form-control-file" id="avatarInput" accept="image/*">
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Save Changes</button>
        </form>
        <p class="mt-3 text-center"><a href="{% url 'profile' %}" style="color: var(--text-muted);">Cancel</a></p>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    const avatarInput = document.getElementById('avatarInput');
    const avatarPreview = document.getElementById('avatarPreview');

    if (avatarInput) {
        avatarInput.addEventListener('change', function () {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    avatarPreview.src = e.target.result;
                }
                reader.readAsDataURL(file);
            }
        });
    }
</script>
{% endblock %}
